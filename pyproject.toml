[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codesignal-practice-simulator"
version = "0.1.0"
description = "A local CodeSignal practice simulator"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
codesignal-sim = "codesignal_practice_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codesignal_practice_simulator = [
    "resources/*.json",
    "web/static/*",
]
